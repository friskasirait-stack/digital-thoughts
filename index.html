<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Digital Notebook by Friska</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,600;1,400&family=Inter:wght@300;400;500;600&display=swap" rel="stylesheet">
  <style>
    body { background: linear-gradient(135deg, #FDFBF7 0%, #F0EAE1 100%); color: #4A3F35; font-family: 'Inter', sans-serif; display: flex; flex-direction: column; min-height: 100vh; }
    h1, h2, h3, .serif { font-family: 'Playfair Display', serif; }
    .card { background-color: #FFFFFF; border: 1px solid #EBE6DF; border-top: 4px solid #8C7A6B; transition: all 0.3s ease; box-shadow: 0 2px 10px rgba(140, 122, 107, 0.05); cursor: pointer; }
    .card:hover { box-shadow: 0 8px 25px rgba(140, 122, 107, 0.15); transform: translateY(-3px); }
    .btn-primary { background-color: #8C7A6B; color: white; box-shadow: 0 4px 10px rgba(140, 122, 107, 0.2); }
    .btn-primary:hover { background-color: #736254; }
    .category-pill { background-color: rgba(255,255,255,0.6); border: 1px solid #D9D0C5; color: #736254; }
    .category-pill.active { background-color: #8C7A6B; color: white; border-color: #8C7A6B; }
    .delete-btn { display: none; }
    .admin-mode .delete-btn { display: block; }
    ::-webkit-scrollbar { width: 6px; }
    ::-webkit-scrollbar-track { background: transparent; }
    ::-webkit-scrollbar-thumb { background: #D9D0C5; border-radius: 10px; }
    ::-webkit-scrollbar-thumb:hover { background: #8C7A6B; }
  </style>
</head>
<body class="p-6 md:p-12 relative overflow-x-hidden">

  <!-- Dekorasi -->
  <div class="absolute top-[-10%] left-[-5%] w-72 h-72 bg-[#E2D6C8] rounded-full mix-blend-multiply filter blur-3xl opacity-50 z-0 pointer-events-none"></div>
  <div class="absolute bottom-[20%] right-[-5%] w-80 h-80 bg-[#D9CDBC] rounded-full mix-blend-multiply filter blur-3xl opacity-40 z-0 pointer-events-none"></div>

  <div class="max-w-5xl mx-auto w-full flex-grow z-10 relative">
    <header class="flex flex-col sm:flex-row justify-between items-start sm:items-center gap-6 mb-12 bg-white/40 p-6 rounded-3xl backdrop-blur-sm border border-white/50 shadow-sm">
      <div class="flex items-center gap-5">
        <img src="https://raw.githubusercontent.com/friskasirait-stack/Foto-KKN/main/pyudi.jpg" alt="Friska Sirait" class="w-16 h-16 rounded-full object-cover border-2 border-white shadow-md">
        <div>
          <h1 class="text-4xl font-semibold mb-1">Notebook.</h1>
          <p class="text-sm text-[#736254] font-light italic serif">A quiet place for your thoughts.</p>
        </div>
      </div>
      <button id="btn-tambah" onclick="openWriteModal()" class="hidden btn-primary px-6 py-3 rounded-full text-sm font-medium transition items-center gap-2"><span>✎</span> New Note</button>
    </header>

    <nav class="flex gap-3 mb-10 overflow-x-auto pb-4 scrollbar-hide" id="category-nav">
      <button onclick="filterNotes('All', this)" class="category-pill active px-5 py-2 rounded-full text-sm transition whitespace-nowrap">✨ All</button>
      <button onclick="filterNotes('🕊️ Religion', this)" class="category-pill px-5 py-2 rounded-full text-sm transition whitespace-nowrap">🕊️ Religion</button>
      <button onclick="filterNotes('🔬 Science', this)" class="category-pill px-5 py-2 rounded-full text-sm transition whitespace-nowrap">🔬 Science</button>
      <button onclick="filterNotes('📜 History', this)" class="category-pill px-5 py-2 rounded-full text-sm transition whitespace-nowrap">📜 History</button>
      <button onclick="filterNotes('🎨 Art', this)" class="category-pill px-5 py-2 rounded-full text-sm transition whitespace-nowrap">🎨 Art</button>
      <button onclick="filterNotes('🤎 Love', this)" class="category-pill px-5 py-2 rounded-full text-sm transition whitespace-nowrap">🤎 Love</button>
      <button onclick="filterNotes('📖 Journal', this)" class="category-pill px-5 py-2 rounded-full text-sm transition whitespace-nowrap">📖 Journal</button>
    </nav>

    <main id="notes-container" class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-6">
      <p id="loading-text" class="text-center text-[#8C7A6B] col-span-full py-10 font-medium">Loading your thoughts...</p>
    </main>
  </div>

  <footer class="w-full text-center py-8 mt-12 z-10 relative flex justify-center items-center gap-2">
    <p class="text-[11px] text-[#8C7A6B] tracking-[0.25em] uppercase font-medium bg-white/50 px-4 py-2 rounded-full backdrop-blur-sm border border-white">digital thoughts by friska's sirait</p>
    <button onclick="loginAdmin()" class="text-[#8C7A6B] hover:text-[#4A3F35] transition text-lg" title="Admin Login">🔒</button>
  </footer>

  <!-- Modal BACA -->
  <div id="readModal" class="fixed inset-0 bg-[#4A3F35] bg-opacity-60 hidden items-center justify-center backdrop-blur-md z-50 p-4 transition-opacity">
    <div class="bg-[#FDFBF7] p-8 md:p-12 rounded-3xl w-full max-w-2xl mx-auto shadow-2xl relative border-2 border-white max-h-[90vh] overflow-y-auto flex flex-col">
      <button onclick="closeReadModal()" class="absolute top-6 right-6 text-gray-400 hover:text-[#8C7A6B] text-3xl transition leading-none">&times;</button>
      <div class="mb-8 mt-2">
        <span id="read-category" class="bg-[#F0EAE1] text-[#736254] text-sm px-4 py-1.5 rounded-md font-medium inline-block mb-4"></span>
        <h2 id="read-title" class="text-3xl md:text-4xl font-semibold serif text-[#4A3F35] leading-tight"></h2>
      </div>
      <div id="read-content" class="text-base md:text-lg leading-relaxed text-gray-700 whitespace-pre-wrap font-light border-t border-[#EBE6DF] pt-6 flex-grow"></div>
    </div>
  </div>

  <!-- Modal TULIS -->
  <div id="writeModal" class="fixed inset-0 bg-[#4A3F35] bg-opacity-40 hidden items-center justify-center backdrop-blur-md z-50 p-4">
    <div class="bg-[#FDFBF7] p-8 rounded-3xl w-full max-w-lg mx-auto shadow-2xl relative border-2 border-white">
      <button onclick="closeWriteModal()" class="absolute top-5 right-6 text-gray-400 hover:text-[#8C7A6B] text-2xl transition">&times;</button>
      <h2 class="text-2xl font-semibold mb-6 serif italic text-[#4A3F35]">Write something...</h2>
      <div class="space-y-5">
        <div>
          <label class="block text-xs uppercase tracking-wider text-[#8C7A6B] font-semibold mb-2">Category</label>
          <select id="kategori" class="w-full bg-white border border-[#D9D0C5] rounded-xl px-4 py-3 focus:outline-none focus:ring-2 focus:ring-[#8C7A6B] shadow-sm">
            <option>🕊️ Religion</option>
            <option>🔬 Science</option>
            <option>📜 History</option>
            <option>🎨 Art</option>
            <option>🤎 Love</option>
            <option>📖 Journal</option>
          </select>
        </div>
        <div>
          <label class="block text-xs uppercase tracking-wider text-[#8C7A6B] font-semibold mb-2">Title</label>
          <input type="text" id="judul" class="w-full bg-white border border-[#D9D0C5] rounded-xl px-4 py-3 focus:outline-none focus:ring-2 focus:ring-[#8C7A6B]" placeholder="What's on your mind?">
        </div>
        <div>
          <label class="block text-xs uppercase tracking-wider text-[#8C7A6B] font-semibold mb-2">Notes</label>
          <textarea id="isi" rows="6" class="w-full bg-white border border-[#D9D0C5] rounded-xl px-4 py-3 focus:outline-none focus:ring-2 focus:ring-[#8C7A6B]" placeholder="Pour your thoughts here..."></textarea>
        </div>
        <button id="btn-simpan" onclick="submitNote()" class="btn-primary w-full py-3.5 rounded-xl mt-2 font-medium transition text-lg shadow-lg">Save Note</button>
      </div>
    </div>
  </div>

  <script>
    const API_URL = "https://script.google.com/macros/s/AKfycbxL6UHsk6TzTGlsf4oOxTVdTO9WzOZwasGCEGEopNgQ0RvvJ2axCu6zSN-pBR51abliBA/exec";
    
    let mySecretPin = "";
    let allNotes = []; 
    let currentFilter = "All";

    window.onload = function() { loadNotes(); };

    function loginAdmin() {
      const inputPin = prompt("Enter Friska's Secret PIN:");
      if (inputPin) {
        mySecretPin = inputPin;
        document.getElementById('btn-tambah').classList.remove('hidden');
        document.getElementById('btn-tambah').classList.add('flex');
        document.body.classList.add('admin-mode');
        alert("Friska mode activated! You can now add or delete notes.");
      }
    }

    function loadNotes() {
      document.getElementById('notes-container').innerHTML = `<p class="text-center text-[#8C7A6B] col-span-full py-10 font-medium">Loading your thoughts...</p>`;
      
      // Menggunakan allorigins versi GET yang membungkus respon dalam JSON murni (Sangat Stabil)
      const proxyUrl = "https://api.allorigins.win/get?url=" + encodeURIComponent(API_URL);

      fetch(proxyUrl)
        .then(response => {
          if (!response.ok) throw new Error('Jaringan bermasalah');
          return response.json();
        })
        .then(data => {
          // data.contents berisi JSON murni dari Google Apps Script
          allNotes = JSON.parse(data.contents);
          renderNotes();
        })
        .catch(error => {
          // Jika allorigins gagal, pindah ke proxy alternatif (corsproxy.io)
          fetch("https://corsproxy.io/?" + encodeURIComponent(API_URL))
            .then(res => res.json())
            .then(data => {
              allNotes = data;
              renderNotes();
            })
            .catch(err => {
              document.getElementById('notes-container').innerHTML = `<p class="text-center text-red-500 col-span-full py-10 font-medium">Gagal memuat. Silakan tarik layar untuk refresh.</p>`;
            });
        });
    }

    function filterNotes(category, element) {
      currentFilter = category;
      const buttons = document.querySelectorAll('#category-nav button');
      buttons.forEach(btn => btn.classList.remove('active', 'text-white'));
      element.classList.add('active');
      renderNotes();
    }

    function renderNotes() {
      const container = document.getElementById('notes-container');
      container.innerHTML = '';
      
      const filteredNotes = currentFilter === 'All' ? allNotes : allNotes.filter(n => n.category === currentFilter);
      
      if (filteredNotes.length === 0) {
        container.innerHTML = `<p class="text-center text-[#8C7A6B] col-span-full py-10 font-medium">No notes in this category yet.</p>`;
        return;
      }

      filteredNotes.forEach(note => {
        const card = document.createElement('div');
        card.className = "card p-6 rounded-2xl relative group flex flex-col justify-between";
        card.onclick = function() { openReadModal(note.id); };
        
        card.innerHTML = `
          <div>
            <div class="flex justify-between items-start mb-4">
              <span class="bg-[#F0EAE1] text-[#736254] text-xs px-3 py-1 rounded-md font-medium">${note.category}</span>
              <button onclick="hapusNote(event, '${note.id}')" class="delete-btn text-red-400 hover:text-red-600 text-sm font-semibold p-2 opacity-0 group-hover:opacity-100 transition relative z-20">Delete</button>
            </div>
            <h3 class="text-xl font-semibold mb-2 group-hover:text-[#8C7A6B] transition">${note.title}</h3>
          </div>
          <p class="text-[13px] text-[#A69B8F] mt-4 flex items-center gap-1 font-medium group-hover:translate-x-1 transition-transform">Read thoughts &rarr;</p>
        `;
        container.appendChild(card);
      });
    }

    function openReadModal(id) {
      const note = allNotes.find(n => n.id === id);
      if(note) {
        document.getElementById('read-category').innerText = note.category;
        document.getElementById('read-title').innerText = note.title;
        document.getElementById('read-content').innerText = note.content;
        document.getElementById('readModal').classList.remove('hidden');
        document.getElementById('readModal').classList.add('flex');
      }
    }

    function closeReadModal() {
      document.getElementById('readModal').classList.add('hidden');
      document.getElementById('readModal').classList.remove('flex');
    }

    function openWriteModal() {
      document.getElementById('writeModal').classList.remove('hidden');
      document.getElementById('writeModal').classList.add('flex');
    }

    function closeWriteModal() {
      document.getElementById('writeModal').classList.add('hidden');
      document.getElementById('writeModal').classList.remove('flex');
      document.getElementById('judul').value = '';
      document.getElementById('isi').value = '';
    }

    function submitNote() {
      const kategori = document.getElementById('kategori').value;
      const judul = document.getElementById('judul').value;
      const isi = document.getElementById('isi').value;
      if(!judul || !isi) { alert("Title and notes cannot be empty!"); return; }

      const btn = document.getElementById('btn-simpan');
      btn.innerText = 'Saving...'; btn.disabled = true;

      fetch(API_URL, {
        method: 'POST',
        mode: 'no-cors',
        headers: { "Content-Type": "text/plain;charset=utf-8" },
        body: JSON.stringify({ action: 'save', pin: mySecretPin, category: kategori, title: judul, content: isi })
      })
      .then(() => {
        btn.innerText = 'Save Note'; btn.disabled = false;
        closeWriteModal();
        setTimeout(loadNotes, 1000);
      })
      .catch(err => { 
        btn.innerText = 'Save Note'; btn.disabled = false; 
        alert("Gagal menyimpan: " + err.message); 
      });
    }

    function hapusNote(event, id) {
      event.stopPropagation(); 
      if(confirm("Are you sure you want to delete this note?")) {
        fetch(API_URL, {
          method: 'POST',
          mode: 'no-cors',
          headers: { "Content-Type": "text/plain;charset=utf-8" },
          body: JSON.stringify({ action: 'delete', pin: mySecretPin, id: id })
        })
        .then(() => {
          setTimeout(loadNotes, 1000);
        });
      }
    }
  </script>
</body>
</html>
